<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>atomic-train.com</title>
  <style>
    :root {
      --bg: #0e0f12;
      --surface: #17191f;
      --border: #262933;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #e05a3a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 20px 64px;
      flex: 1;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 28px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }

    .brand h1 {
      font-size: 1.6rem;
      letter-spacing: -0.02em;
    }

    .brand p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .btn:hover {
      border-color: var(--accent);
      background: #20232c;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-head h2 {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    /* Random Spotlight Strip */
    .spotlight {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 44px;
    }

    @media (max-width: 720px) {
      .spotlight { grid-template-columns: 1fr; }
    }

    .spot-card {
      aspect-ratio: 4 / 3;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .spot-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .spot-card:hover img {
      transform: scale(1.04);
    }

    /* Full Gallery Masonry */
    .gallery {
      columns: 4 220px;
      column-gap: 12px;
    }

    .tile {
      break-inside: avoid;
      margin-bottom: 12px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .tile img {
      width: 100%;
      height: auto;
      display: block;
      transition: opacity 0.2s ease, transform 0.25s ease;
    }

    .tile:hover img {
      transform: scale(1.03);
    }

    .status {
      text-align: center;
      color: var(--muted);
      padding: 64px 20px;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 6px;
    }

    .lb-btn {
      position: fixed;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .lb-btn:hover { background: rgba(255, 255, 255, 0.24); }
    .lb-close { top: 20px; right: 22px; }
    .lb-prev { left: 20px; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 20px; top: 50%; transform: translateY(-50%); }

    .lb-counter {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.65);
      padding: 5px 12px;
      border-radius: 999px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <h1>atomic-train.com</h1>
        <p id="subtitle">Selected photos</p>
      </div>
      <div class="actions">
        <button class="btn" id="shuffle-btn" type="button">↻ Shuffle</button>
        <a class="btn" id="album-link" href="https://photos.app.goo.gl/zntpiVSbSn6L2Nr5A" target="_blank" rel="noopener">
          Full Album ↗
        </a>
        <a class="btn" href="https://www.instagram.com/KasperRedBeard/" target="_blank" rel="noopener">
          @KasperRedBeard ↗
        </a>
      </div>
    </header>

    <div id="status" class="status">Loading photos…</div>

    <section id="spotlight-section" style="display:none;">
      <div class="section-head">
        <h2>Random Picks</h2>
      </div>
      <div id="spotlight" class="spotlight"></div>
    </section>

    <section id="gallery-section" style="display:none;">
      <div class="section-head">
        <h2>All Photos</h2>
        <span id="photo-count" style="color:var(--muted); font-size:0.85rem;"></span>
      </div>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  <footer>atomic-train.com</footer>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lb-btn lb-close" id="lb-close" aria-label="Close">×</button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous">‹</button>
    <img id="lb-img" alt="Full size photo" />
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next">›</button>
    <div class="lb-counter" id="lb-counter"></div>
  </div>

  <script>
    let allPhotos = [];
    let currentIndex = 0;

    const statusEl = document.getElementById("status");
    const spotlightSection = document.getElementById("spotlight-section");
    const spotlightEl = document.getElementById("spotlight");
    const gallerySection = document.getElementById("gallery-section");
    const galleryEl = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lb-img");
    const lbCounter = document.getElementById("lb-counter");

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderSpotlight() {
      spotlightEl.innerHTML = "";
      const picks = shuffleArray(allPhotos.map((p, idx) => ({ ...p, idx }))).slice(0, 3);

      picks.forEach((photo) => {
        const card = document.createElement("div");
        card.className = "spot-card";
        const img = document.createElement("img");
        img.src = `${photo.url}=w1000-no`;
        img.alt = "Featured photo";
        img.loading = "eager";
        card.appendChild(img);
        card.addEventListener("click", () => openLightbox(photo.idx));
        spotlightEl.appendChild(card);
      });
    }

    function renderGallery() {
      galleryEl.innerHTML = "";
      allPhotos.forEach((photo, idx) => {
        const tile = document.createElement("div");
        tile.className = "tile";
        const img = document.createElement("img");
        img.src = `${photo.url}=w640-no`;
        img.width = photo.width;
        img.height = photo.height;
        img.alt = `Photo ${idx + 1}`;
        img.loading = "lazy";
        tile.appendChild(img);
        tile.addEventListener("click", () => openLightbox(idx));
        galleryEl.appendChild(tile);
      });
    }

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
    }

    function updateLightbox() {
      const photo = allPhotos[currentIndex];
      lbImg.src = `${photo.url}=w2048-no`;
      lbCounter.textContent = `${currentIndex + 1} / ${allPhotos.length}`;
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      lbImg.src = "";
    }

    function stepLightbox(delta) {
      currentIndex = (currentIndex + delta + allPhotos.length) % allPhotos.length;
      updateLightbox();
    }

    async function init() {
      try {
        const res = await fetch("./photos.json", { cache: "no-cache" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        allPhotos = data.photos || [];
        if (!allPhotos.length) {
          statusEl.textContent = "No photos synced yet.";
          return;
        }

        if (data.title) {
          document.getElementById("subtitle").textContent = data.title;
        }
        document.getElementById("photo-count").textContent = `${allPhotos.length} photos`;

        statusEl.style.display = "none";
        spotlightSection.style.display = "block";
        gallerySection.style.display = "block";

        renderSpotlight();
        renderGallery();
      } catch (err) {
        statusEl.textContent = "Run the 'Sync Google Photos Album' GitHub Action once to generate photos.json.";
        console.error(err);
      }
    }

    document.getElementById("shuffle-btn").addEventListener("click", renderSpotlight);
    document.getElementById("lb-close").addEventListener("click", closeLightbox);
    document.getElementById("lb-prev").addEventListener("click", () => stepLightbox(-1));
    document.getElementById("lb-next").addEventListener("click", () => stepLightbox(1));

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") stepLightbox(-1);
      if (e.key === "ArrowRight") stepLightbox(1);
    });

    init();
  </script>
</body>
</html>
