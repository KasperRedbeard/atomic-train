name: Sync Google Photos Album

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync-photos.mjs"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch album photos
        run: node scripts/sync-photos.mjs

      - name: Commit updated photos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update photos.json from Google Photos album"
            git push
          fi